services:
  # 1. Backend Web Service
  - type: web
    name: nagarik-saathi-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard with your MongoDB Atlas URI
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # Set to your frontend Render URL
      - key: GEMINI_API_KEY
        sync: false
      - key: N8N_WHATSAPP_SHARE_WEBHOOK
        value: https://vedu-007.app.n8n.cloud/webhook/scheme-alert
      - key: N8N_FORM_AUTOFILL_WEBHOOK
        value: https://vedu-007.app.n8n.cloud/webhook/submit-beneficiary-form
      - key: N8N_OTP_SEND_WEBHOOK
        value: https://vedu-007.app.n8n.cloud/webhook/90d569f6-da9b-4aae-b44d-b1e623e72353

  # 2. Next.js Frontend Web Service
  - type: web
    name: nagarik-saathi-frontend
    runtime: node
    plan: free
    rootDir: frontend/nextjs
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXT_PUBLIC_API_URL
        sync: false # e.g. https://nagarik-saathi-backend.onrender.com/api
