services:
  # NagarikSaathi Full-Stack Web Service (Vite + Express + AI)
  - type: web
    name: nagarik-saathi
    runtime: node
    plan: free
    buildCommand: npm run install-all && npm run build:frontend
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard with your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Set your Google Gemini API Key in Render Dashboard
      - key: TAVILY_API_KEY
        sync: false # Optional Tavily API Key
      - key: N8N_WHATSAPP_SHARE_WEBHOOK
        value: https://vedu-007.app.n8n.cloud/webhook/scheme-alert
      - key: N8N_FORM_AUTOFILL_WEBHOOK
        value: https://vedu-007.app.n8n.cloud/webhook/submit-beneficiary-form
      - key: N8N_OTP_SEND_WEBHOOK
        value: https://vedu-007.app.n8n.cloud/webhook/90d569f6-da9b-4aae-b44d-b1e623e72353
